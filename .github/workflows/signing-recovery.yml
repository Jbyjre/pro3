name: Recover existing signing identity
on:
  push:
    branches: ['codex/breathe-and-updates']
    paths: ['.github/workflows/signing-recovery.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: key
        with:
          path: ~/.glint-signing
          key: glint-signing-key-v1
          fail-on-cache-miss: true
      - name: Encrypt for this session only
        run: |
          test -s "$HOME/.glint-signing/glint.jks"
          tar czf - -C "$HOME" .glint-signing | openssl cms -encrypt -binary -aes-256-cbc -outform DER -out signing-backup.cms .github/signing-recovery.pem
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-signing-backup
          path: signing-backup.cms
          retention-days: 1
