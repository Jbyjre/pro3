# Helper for Claude's cloud sessions: the session sandbox cannot reach Google's Maven
# servers, so this job downloads every build dependency on a GitHub runner and parks a
# snapshot of the Gradle cache on a temporary pre-release. Safe to delete at any time.
name: Dependency snapshot (helper)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deps-snapshot.yml'
      - '.github/deps-snapshot-trigger'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: yes | sdkmanager "ndk;30.0.14904198" > /dev/null
      - name: Resolve everything with a clean Gradle home
        working-directory: android
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gh
        run: |
          ./gradlew --no-daemon --no-configuration-cache assembleFossDebug assembleFossRelease testFossDebugUnitTest lintFossDebug || true
      - name: Pack and publish snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${{ runner.temp }}/gh"
          tar -czf "${{ runner.temp }}/gradle-deps.tgz" caches/modules-2/files-2.1 caches/modules-2/metadata-*
          ls -lh "${{ runner.temp }}/gradle-deps.tgz"
          cd "$GITHUB_WORKSPACE"
          gh release delete ci-deps-snapshot --cleanup-tag -y || true
          gh release create ci-deps-snapshot --prerelease --target "$GITHUB_SHA" \
            --title "Build helper (not an app release)" \
            --notes "Temporary dependency snapshot used by cloud build sessions. Not an app download." \
            "${{ runner.temp }}/gradle-deps.tgz"
