# Builds the Glint Android app on every push to any branch (including names with a
# slash) and publishes a ready-to-install APK:
#   - pushes to main   -> release "Glint":            .../releases/latest/download/Glint.apk
#   - any other branch -> pre-release "Glint preview": .../releases/download/glint-preview/Glint-preview.apk
# No upstream signing secrets are used. The fork's own signing key is created on the
# first run and kept in this repository's private GitHub Actions cache, never in the code.
# A weekly run keeps that cache alive (GitHub drops caches unused for 7 days).
name: Build Glint APK

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'linux/**'
      - 'docs/**'
      - 'imgs/**'
      - '**.md'
      - '.github/deps-snapshot-trigger'
      - '.github/workflows/deps-snapshot.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Glint signing key
        id: key
        uses: actions/cache@v4
        with:
          path: ~/.glint-signing
          key: glint-signing-key-v1

      - name: Create Glint signing key (first run only)
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.glint-signing
          PASS=$(openssl rand -hex 24)
          printf '%s' "$PASS" > ~/.glint-signing/pass
          keytool -genkeypair -keystore ~/.glint-signing/glint.jks -storetype PKCS12 \
            -alias glint -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Glint, O=Jbyjre" > /dev/null

      - name: Keep-alive run stops here
        if: github.event_name == 'schedule'
        run: echo "Signing key cache refreshed."

      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'schedule'

      - name: Install NDK and CMake
        if: github.event_name != 'schedule'
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;30.0.14904198" "cmake;3.22.1" > /dev/null

      - name: Unit tests
        if: github.event_name != 'schedule'
        working-directory: android
        run: ./gradlew testFossDebugUnitTest

      - name: Lint
        if: github.event_name != 'schedule'
        working-directory: android
        run: ./gradlew lintFossRelease

      - name: Build signed release APK
        if: github.event_name != 'schedule'
        working-directory: android
        run: |
          export GLINT_KEYSTORE="$HOME/.glint-signing/glint.jks"
          export GLINT_KEYSTORE_PASSWORD="$(cat "$HOME/.glint-signing/pass")"
          ./gradlew assembleFossRelease
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs \
            app/build/outputs/apk/foss/release/app-foss-release.apk | grep -i "certificate DN"

      - name: Upload lint report
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-fossRelease.html
          if-no-files-found: ignore

      - name: Collect APK
        if: github.event_name != 'schedule'
        id: apk
        run: |
          VERSION=$(grep 'val appVersionName =' android/app/build.gradle.kts | sed 's/.*= "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp android/app/build/outputs/apk/foss/release/app-foss-release.apk out/app.apk

      - name: Publish release (main)
        if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/app.apk out/Glint.apk
          gh release delete glint-latest --cleanup-tag -y || true
          gh release create glint-latest --latest --target "$GITHUB_SHA" \
            --title "Glint ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})" \
            --notes "On your phone, tap **Glint.apk** below to download it, then open the download to install. Built from commit ${{ steps.apk.outputs.short_sha }}." \
            out/Glint.apk

      - name: Publish preview pre-release (other branches)
        if: github.event_name != 'schedule' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/app.apk out/Glint-preview.apk
          gh release delete glint-preview --cleanup-tag -y || true
          gh release create glint-preview --prerelease --target "$GITHUB_SHA" \
            --title "Glint preview (${{ github.ref_name }}, build ${{ github.run_number }})" \
            --notes "Test build from branch ${{ github.ref_name }} (commit ${{ steps.apk.outputs.short_sha }}). Tap **Glint-preview.apk** to download and install." \
            out/Glint-preview.apk
