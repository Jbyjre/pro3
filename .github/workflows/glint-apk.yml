# Builds the pro Android app on every push to any branch (including names with a
# slash) and publishes a ready-to-install APK:
#   - pushes to main   -> release "pro":              .../releases/latest/download/pro.apk
#   - any other branch -> pre-release "pro preview":  .../releases/download/glint-preview/pro-preview.apk
# The existing signing identity comes from repository secrets, with the original cache as
# a migration fallback. Missing identity fails closed; a new key is NEVER generated.
# A weekly run keeps that cache alive (GitHub drops caches unused for 7 days).
name: Build pro APK

on:
  push:
    # The app's heart-rate backup branch only holds data files: never build it.
    branches: ['**', '!heart-backup']
    paths-ignore:
      - 'linux/**'
      - 'docs/**'
      - 'imgs/**'
      - '**.md'
      - '.github/deps-snapshot-trigger'
      - '.github/workflows/deps-snapshot.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write

concurrency:
  group: pro-release-${{ github.ref == 'refs/heads/main' && 'stable' || 'preview' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Glint signing key
        id: key
        uses: actions/cache@v4
        with:
          path: ~/.glint-signing
          key: glint-signing-key-v1

      - name: Load durable signing identity, or retain the existing cached key
        env:
          SIGNING_KEY: ${{ secrets.PRO_SIGNING_KEY_B64 }}
          SIGNING_PASSWORD: ${{ secrets.PRO_SIGNING_PASSWORD }}
        run: |
          umask 077
          mkdir -p ~/.glint-signing
          if [ -n "$SIGNING_KEY" ] && [ -n "$SIGNING_PASSWORD" ]; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > ~/.glint-signing/glint.jks
            printf '%s' "$SIGNING_PASSWORD" > ~/.glint-signing/pass
          fi
          test -s ~/.glint-signing/glint.jks && test -s ~/.glint-signing/pass || {
            echo 'Existing signing identity missing. Restore PRO_SIGNING_KEY_B64 and PRO_SIGNING_PASSWORD; never regenerate.' >&2
            exit 1
          }

      - name: Verify signing continuity
        run: |
          CERT=$(keytool -exportcert -keystore "$HOME/.glint-signing/glint.jks" -alias glint -storepass:file "$HOME/.glint-signing/pass" | sha256sum | cut -d' ' -f1)
          test "$CERT" = '9dcdd1402e7eff958007957933847bf23bfcac1ec99a500a0b041ee07c159d94'

      - name: Keep-alive run stops here
        if: github.event_name == 'schedule'
        run: echo "Signing key cache refreshed."

      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'schedule'

      - name: Install NDK and CMake
        if: github.event_name != 'schedule'
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;30.0.14904198" "cmake;3.22.1" > /dev/null

      - name: Unit tests
        if: github.event_name != 'schedule'
        working-directory: android
        run: ./gradlew testFossDebugUnitTest

      - name: Upload UI screenshots
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: android/app/build/screenshots
          if-no-files-found: ignore

      - name: Lint
        if: github.event_name != 'schedule'
        working-directory: android
        run: ./gradlew lintFossRelease

      - name: Build signed release APK
        if: github.event_name != 'schedule'
        working-directory: android
        run: |
          export GLINT_KEYSTORE="$HOME/.glint-signing/glint.jks"
          export GLINT_KEYSTORE_PASSWORD="$(cat "$HOME/.glint-signing/pass")"
          export PRO_UPDATE_CHANNEL="${{ github.ref == 'refs/heads/main' && 'stable' || 'preview' }}"
          ./gradlew assembleFossRelease
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs \
            app/build/outputs/apk/foss/release/app-foss-release.apk | grep -i "certificate DN"

      - name: Upload lint report
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-fossRelease.html
          if-no-files-found: ignore

      - name: Publish verified versioned release and channel pointer
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          PRO_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'stable' || 'preview' }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "$PRO_CHANNEL" = stable ]; then
            ASSET=pro.apk
            POINTER=glint-latest
            FLAGS=(--latest)
          else
            ASSET=pro-preview.apk
            POINTER=glint-preview
            FLAGS=(--prerelease --latest=false)
          fi
          cp android/app/build/outputs/apk/foss/release/app-foss-release.apk "out/$ASSET"
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          python3 android/tools/release-metadata.py "out/$ASSET" "$PRO_CHANNEL" "$AAPT" > out/update.json
          CODE=$(python3 -c "import json; print(json.load(open('out/update.json'))['versionCode'])")
          TAG="pro-$PRO_CHANNEL-$CODE"
          gh release create "$TAG" "${FLAGS[@]}" --target "$GITHUB_SHA" \
            --title "pro $PRO_CHANNEL · build $CODE" \
            --notes "Signed build $CODE from $GITHUB_SHA. Existing installations keep their data. Future updates are in pro > Phone > App updates." \
            "out/$ASSET" out/update.json
          # Never regress the channel pointer if a slower older build finishes later.
          mkdir -p previous
          gh release download "$POINTER" --pattern update.json --dir previous || true
          if [ -f previous/update.json ]; then
            OLD=$(python3 -c "import json; print(json.load(open('previous/update.json'))['versionCode'])")
            if [ "$OLD" -gt "$CODE" ]; then exit 0; fi
          fi
          if ! gh release view "$POINTER" >/dev/null 2>&1; then
            gh release create "$POINTER" "${FLAGS[@]}" --target "$GITHUB_SHA" --title "pro $PRO_CHANNEL" --notes "Latest $PRO_CHANNEL build."
          fi
          # Upload APK first, metadata last. Metadata always points to the immutable release above.
          gh release upload "$POINTER" "out/$ASSET" --clobber
          gh release upload "$POINTER" out/update.json --clobber
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$POINTER" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          gh release edit "$POINTER" "${FLAGS[@]}" --title "pro $PRO_CHANNEL · build $CODE" \
            --notes "Signed build $CODE from $GITHUB_SHA. Install $ASSET once, then use pro > Phone > App updates."
